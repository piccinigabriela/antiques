<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Compatibility shim for environment scripts attempting to assign to window.fetch
      try {
        let _currentFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _currentFetch;
          },
          set(newFetch) {
            _currentFetch = newFetch;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback if defineProperty fails
      }
    </script>
