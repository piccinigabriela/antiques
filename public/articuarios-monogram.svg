<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background with warm antique ivory tint -->
  <rect width="500" height="500" fill="#faf8f5" rx="32"/>
  
  <!-- Subtle inner border line (high-end cartouche) -->
  <rect x="24" y="24" width="452" height="452" fill="none" stroke="#e7e0d6" stroke-width="2" rx="20"/>
  <rect x="32" y="32" width="436" height="436" fill="none" stroke="#262320" stroke-opacity="0.08" stroke-width="1" rx="14"/>

  <!-- Corner accent marks (antiquarian touch, clean & minimal) -->
  <line x1="48" y1="48" x2="68" y2="48" stroke="#a89a87" stroke-width="1.5"/>
  <line x1="48" y1="48" x2="48" y2="68" stroke="#a89a87" stroke-width="1.5"/>
  <line x1="452" y1="48" x2="432" y2="48" stroke="#a89a87" stroke-width="1.5"/>
  <line x1="452" y1="48" x2="452" y2="68" stroke="#a89a87" stroke-width="1.5"/>
  <line x1="48" y1="452" x2="68" y2="452" stroke="#a89a87" stroke-width="1.5"/>
  <line x1="48" y1="452" x2="48" y2="432" stroke="#a89a87" stroke-width="1.5"/>
  <line x1="452" y1="452" x2="432" y2="452" stroke="#a89a87" stroke-width="1.5"/>
  <line x1="452" y1="452" x2="452" y2="432" stroke="#a89a87" stroke-width="1.5"/>

  <!-- Monogram A: Clean, restrained transitional serif (non-voluptuous, dignified, sharp) -->
