      L 128,368 
      C 124,378 120,384 108,386 
      L 98,388 
      L 98,396 
      L 178,396 
      L 178,388 
      L 168,386 
      C 156,384 152,378 156,366 
      L 182,296 
      L 316,296 
      L 342,366 
      C 346,378 342,384 330,386 
      L 320,388 
      L 320,396 
      L 404,396 
      L 404,388 
      L 394,386 
      C 382,384 378,378 372,364 
      L 274,108 
      C 270,98 264,96 258,96 
      Z
      M 249,152 
      L 302,282 
      L 196,282 
      Z
    " fill="#1c1917" fill-rule="evenodd"/>

    <!-- Subtle jewel / star antique accent above or at crossbar -->
    <circle cx="250" cy="282" r="3.5" fill="#c29b62"/>
  </g>
</svg>
